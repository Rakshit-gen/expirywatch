[project]
name = "expirywatch"
version = "0.1.0"
description = "Type-aware deadline tracking for real-world documents: passports, licenses, insurance, warranties."
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
]

[project.optional-dependencies]
llm = ["langchain-anthropic>=0.2"]

[project.scripts]
expirywatch = "expirywatch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
